[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundplane"
version = "0.0.1"
description = "Deterministic boundary between model-generated output and code-computed facts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ong Jun Xiong" }]
keywords = ["llm", "agents", "guardrails", "hallucination", "provenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ong6/groundplane"
Repository = "https://github.com/ong6/groundplane"
Issues = "https://github.com/ong6/groundplane/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10"]
langgraph = ["langgraph>=0.2"]
mcp = ["mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["groundplane"]

[tool.mypy]
python_version = "3.10"
files = ["groundplane"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
