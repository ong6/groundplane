name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert tag matches groundplane.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import groundplane; print(groundplane.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match groundplane.__version__ = $version" >&2
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          python -I - <<'PY'
          import importlib.metadata
          import importlib.resources

          import groundplane
          from groundplane import FactRegistry, UnsupportedClaim, boundary, superlative

          assert groundplane.__version__ == importlib.metadata.version("groundplane")
          assert importlib.resources.files("groundplane").joinpath("py.typed").is_file()
          registry = FactRegistry()
          registry.record_ranking("r", {"a": 2, "b": 1}, key="n", tool="wheel-smoke")
          with boundary(registry, facts=["r"], checks=[superlative(fact="r")]) as guard:
              guard.submit({"winner": "a"})
              try:
                  guard.submit({"winner": "b"})
              except UnsupportedClaim:
                  pass
              else:
                  raise AssertionError("installed wheel accepted an unsupported winner")
          print(groundplane.__version__, groundplane.__file__)
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
